services:
  nginx:
    container_name: nginx-inception #dont do this for scaling with --scale nginx=3, but good for referencing it with a static name 
    environment: 
      - DOMAIN_NAME=${DOMAIN_NAME}
    image: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    networks:
      - frontend
    restart: on-failure
  mariadb:
    container_name: mariadb-inception
    image: mariadb
    environment:
      - MARIADB_WP_USER=${MARIADB_WP_USER}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
    build: ./requirements/mariadb
    networks:
      - backend
    restart: on-failure
    secrets:
      - mariadb_root_pw
      - mariadb_wp_user_pw
  wordpress:
    container_name: wordpress-inception
    image: wordpress
    build: ./requirements/wordpress
    networks:
      - backend
      - frontend
    restart: on-failure

networks:
    backend:
      driver: bridge
    frontend:
      driver: bridge

secrets:
  mariadb_root_pw:
    file: ../secrets/mariadb_root_pw.txt
  mariadb_wp_user_pw:
    file: ../secrets/mariadb_wp_user_pw.txt
  
