services:
  nginx:
    container_name: nginx-inception #dont do this for scaling with --scale nginx=3, but good for referencing it with a static name 
    environment: 
      - DOMAIN_NAME=${DOMAIN_NAME}
    image: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    networks:
      - frontend
    restart: on-failure
  mariadb:
    container_name: mariadb-inception
    image: mariadb
    build: ./requirements/mariadb
    networks:
      - backend
    restart: on-failure
  wordpress:
    container_name: wordpress-inception
    image: wordpress
    build: ./requirements/wordpress
    networks:
      - backend
      - frontend
    restart: on-failure

networks:
    backend:
      driver: bridge
    frontend:
      driver: bridge

